<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1565C0">
<meta name="description" content="BanglaBazar online shop">
<title>BanglaBazar</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
<header class="topbar">
  <a class="brand" href="index.html"><span id="brandLogo" class="brand-logo">B</span><span id="brandName">BanglaBazar</span></a>
  <div class="top-actions">
    <button class="icon-btn" id="searchBtn" aria-label="Search">⌕</button>
    <a class="icon-btn" href="wishlist.html" aria-label="Wishlist">♡</a>
    <a class="icon-btn cart-link" href="cart.html" aria-label="Cart">🛒<b id="cartCount">0</b></a>
  </div>
</header>

<section id="searchPanel" class="search-panel hidden">
  <input id="searchInput" type="search" placeholder="পণ্য খুঁজুন...">
</section>

<main class="page">
  <section class="hero">
    <div>
      <span class="eyebrow">আপনার অনলাইন শপ</span>
      <h1 id="heroTitle">BanglaBazar</h1>
      <p>পছন্দের পণ্য সহজে খুঁজুন এবং কার্টে যোগ করুন।</p>
      <a class="btn" href="#products">পণ্য দেখুন</a>
    </div>
  </section>

  <section class="section">
    <div class="section-head"><h2>ক্যাটাগরি</h2></div>
    <div id="categories" class="category-row"></div>
  </section>

  <section id="products" class="section">
    <div class="section-head"><h2>সকল পণ্য</h2><span id="productCount" class="muted"></span></div>
    <div id="productGrid" class="product-grid"><div class="loading">লোড হচ্ছে...</div></div>
  </section>
</main>

<nav class="bottom-nav">
  <a class="active" href="index.html">⌂<small>হোম</small></a>
  <a href="search.html">⌕<small>সার্চ</small></a>
  <a href="cart.html">🛒<small>কার্ট</small></a>
  <a href="wishlist.html">♡<small>উইশলিস্ট</small></a>
  <a href="profile.html">◉<small>প্রোফাইল</small></a>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
